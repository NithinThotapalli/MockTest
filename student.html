<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title></title><link rel="stylesheet" href="styles.css"></head>
<body class="app-body" data-page="student">
  <div class="app-shell"><aside class="sidebar"><a class="brand" href="student.html"></a><nav class="nav-group"><p class="nav-label">My workspace</p><a class="nav-item active" href="student.html"><span class="nav-icon">◈</span>My exams</a></nav><div class="sidebar-bottom"><div class="user-chip"><span class="avatar" data-user-initials>JL</span><span><strong data-user-name>Student</strong><small>Student account</small></span></div><button class="logout">↪ Sign out</button></div></aside>
    <main class="main-content student-main"><header class="student-hero"><div></div></header><div class="student-grid"><section class="panel"><div class="panel-heading"><h3>Available exams</h3><span class="tag" id="exam-count">Loading</span></div><div class="available-exams" id="available-exams"></div></section><section class="panel previous-exams"><div class="panel-heading"><h3>Previous exams</h3><span class="tag" id="previous-count">0 completed</span></div><div class="submission-history" id="submission-history"></div></section></div></main></div>
  <div class="modal-backdrop" id="exam-modal" hidden><div class="modal"><header class="exam-modal-head"><h2 id="modal-title">Exam</h2><div><span class="timer" id="timer">00:00</span><button class="close-modal" id="close-modal" aria-label="Close exam">×</button></div></header><div class="question-list" id="question-list"></div><button class="primary-button submit-exam" id="submit-exam">Submit exam <span>→</span></button></div></div><div class="result-backdrop" id="result-modal" hidden><section class="result-modal" role="dialog" aria-modal="true" aria-labelledby="result-title"><p class="eyebrow">Exam complete</p><h2 id="result-title">Your score</h2><div class="score-display"><strong id="result-score">0/0</strong><span id="result-percent">0%</span></div><p id="result-message">Your result has been saved to Previous exams.</p><button class="primary-button full-width" id="close-result" type="button">Back to workspace</button></section></div><div class="toast" id="toast"></div><script src="app.js"></script>
</body>
</html>
